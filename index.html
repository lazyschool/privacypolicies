<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Privacy Policies</title>
<style>
  :root { --ground: #FAF9FC; --ink: #1A1922; --muted: #6B6779; --accent: #5B4B8A; --hair: #E2DEEC; }
  @media (prefers-color-scheme: dark) {
    :root { --ground: #141319; --ink: #E9E6F0; --muted: #9C97AC; --accent: #B8A6E6; --hair: #322E3D; }
  }
  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--ink); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.65; margin: 0; padding: 3rem 1.5rem 5rem; }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 1.5rem; letter-spacing: -0.015em; }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--hair); }
  li { border-bottom: 1px solid var(--hair); padding: 0.9rem 0; }
  a { color: var(--accent); font-weight: 600; }
  span { display: block; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>Privacy Policies</h1>
  <ul>
    <li><a href="annoying-tasks/">Annoying Tasks</a><span>Android app · com.annoyingtasks.app</span></li>
  </ul>
</main>
</body>
</html>
